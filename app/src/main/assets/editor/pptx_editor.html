<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <script src="file:///android_asset/docx/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #faf9f5;
            --text-primary: #141413;
            --border: #e6dfd8;
            --slide-bg: #ffffff;
        }
        body.dark {
            --bg-color: #151514;
            --text-primary: #f5f5f3;
            --border: #2d2b28;
            --slide-bg: #2d2b28;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-x: hidden;
        }
        #toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        button {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 4px;
            cursor: pointer;
        }
        button:active {
            background: rgba(128,128,128,0.2);
        }
        #editor-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .slide {
            width: 800px;
            height: 450px;
            background: var(--slide-bg);
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transform-origin: top left;
            overflow: hidden;
        }
        .slide-text {
            position: absolute;
            outline: none;
            border: 1px dashed transparent;
            word-wrap: break-word;
        }
        .slide-text:focus {
            border-color: #007bff;
            background: rgba(255,255,255,0.1);
        }
        .slide-img {
            position: absolute;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .slide-img:active {
            border-color: #007bff;
        }
        .controls {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <button onclick="document.execCommand('undo', false, null)">Undo</button>
        <button onclick="document.execCommand('redo', false, null)">Redo</button>
        <div class="controls">
            <button onclick="saveDocument()">Save</button>
            <button onclick="if(window.Android) window.Android.exitWithoutSaving()">Exit</button>
        </div>
    </div>
    <div id="editor-container">
        <!-- Slides will be rendered here -->
    </div>

    <script>
        let currentZip = null;
        let slideCount = 0;
        let xmlDocs = {}; // slideNum -> Document
        let relMaps = {}; // slideNum -> { relId -> path }

        const EMU_PER_PIXEL = 9525;

        function loadPptx(base64, isDark) {
            if (isDark) document.body.classList.add('dark');
            
            const binary_string = window.atob(base64);
            const len = binary_string.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binary_string.charCodeAt(i);
            }
            
            JSZip.loadAsync(bytes.buffer).then(zip => {
                currentZip = zip;
                
                // Find all slides
                const slideFiles = Object.keys(zip.files).filter(f => f.startsWith("ppt/slides/slide") && f.endsWith(".xml"));
                slideCount = slideFiles.length;
                
                let promises = [];
                for (let i = 1; i <= slideCount; i++) {
                    let slidePath = `ppt/slides/slide${i}.xml`;
                    let relsPath = `ppt/slides/_rels/slide${i}.xml.rels`;
                    
                    if (zip.file(slidePath)) {
                        promises.push(zip.file(slidePath).async("text").then(xml => ({ num: i, xml: xml })));
                        if (zip.file(relsPath)) {
                            promises.push(zip.file(relsPath).async("text").then(xml => ({ relNum: i, xml: xml })));
                        }
                    }
                }
                return Promise.all(promises);
            }).then(results => {
                for (let r of results) {
                    if (r.relNum) {
                        const relsParser = new DOMParser();
                        const relsDoc = relsParser.parseFromString(r.xml, "application/xml");
                        const rels = relsDoc.getElementsByTagName("Relationship");
                        relMaps[r.relNum] = {};
                        for (let i = 0; i < rels.length; i++) {
                            relMaps[r.relNum][rels[i].getAttribute("Id")] = "ppt/slides/" + rels[i].getAttribute("Target").replace("../", "");
                        }
                    } else if (r.num) {
                        const parser = new DOMParser();
                        xmlDocs[r.num] = parser.parseFromString(r.xml, "application/xml");
                    }
                }
                renderAllSlides();
            }).catch(e => {
                document.getElementById('editor-container').innerText = "Error loading document: " + e;
            });
        }

        function getEmuRect(sp) {
            let x=0, y=0, w=100, h=100;
            const xfrm = sp.getElementsByTagName("a:xfrm")[0];
            if (xfrm) {
                const off = xfrm.getElementsByTagName("a:off")[0];
                const ext = xfrm.getElementsByTagName("a:ext")[0];
                if (off) { x = parseInt(off.getAttribute("x")||"0")/EMU_PER_PIXEL; y = parseInt(off.getAttribute("y")||"0")/EMU_PER_PIXEL; }
                if (ext) { w = parseInt(ext.getAttribute("cx")||"0")/EMU_PER_PIXEL; h = parseInt(ext.getAttribute("cy")||"0")/EMU_PER_PIXEL; }
            }
            return {x, y, w, h};
        }

        function renderAllSlides() {
            const container = document.getElementById("editor-container");
            container.innerHTML = "";
            
            // For simple scaling based on screen width
            const screenWidth = window.innerWidth - 32;
            const scale = Math.min(1.0, screenWidth / 800);
            
            for (let i = 1; i <= slideCount; i++) {
                if (!xmlDocs[i]) continue;
                
                const slideDiv = document.createElement("div");
                slideDiv.className = "slide";
                slideDiv.style.transform = `scale(${scale})`;
                slideDiv.style.marginBottom = `-${450 * (1 - scale)}px`; // Compensate for scaling
                
                const doc = xmlDocs[i];
                
                // Render shapes (text boxes)
                const shapes = doc.getElementsByTagName("p:sp");
                for (let j = 0; j < shapes.length; j++) {
                    const sp = shapes[j];
                    const rect = getEmuRect(sp);
                    
                    const txBody = sp.getElementsByTagName("p:txBody")[0];
                    if (txBody) {
                        const texts = sp.getElementsByTagName("a:t");
                        let fullText = "";
                        for (let k=0; k<texts.length; k++) { fullText += texts[k].textContent + " "; }
                        
                        if (fullText.trim().length > 0 || true) {
                            const textDiv = document.createElement("div");
                            textDiv.className = "slide-text";
                            textDiv.style.left = rect.x + "px";
                            textDiv.style.top = rect.y + "px";
                            textDiv.style.width = rect.w + "px";
                            textDiv.style.height = rect.h + "px";
                            textDiv.contentEditable = "true";
                            textDiv.innerText = fullText.trim();
                            // Store reference for saving
                            textDiv.dataset.slide = i;
                            textDiv.dataset.shapeIdx = j;
                            slideDiv.appendChild(textDiv);
                        }
                    }
                }
                
                // Render pictures
                const pics = doc.getElementsByTagName("p:pic");
                for (let j = 0; j < pics.length; j++) {
                    const pic = pics[j];
                    const rect = getEmuRect(pic);
                    
                    const blip = pic.getElementsByTagName("a:blip")[0];
                    if (blip) {
                        const embedId = blip.getAttribute("r:embed");
                        if (embedId && relMaps[i] && relMaps[i][embedId]) {
                            const path = relMaps[i][embedId];
                            const img = document.createElement("img");
                            img.className = "slide-img";
                            img.style.left = rect.x + "px";
                            img.style.top = rect.y + "px";
                            img.style.width = rect.w + "px";
                            img.style.height = rect.h + "px";
                            img.onclick = () => onImageClick(i, embedId, path);
                            img.id = `img_${i}_${embedId}`;
                            slideDiv.appendChild(img);
                            
                            loadImage(path, img.id);
                        }
                    }
                }
                
                container.appendChild(slideDiv);
            }
        }

        async function loadImage(path, imgId) {
            try {
                // ppt/slides/../media/image1.jpeg -> ppt/media/image1.jpeg
                let resolvedPath = path.replace("slides/../media", "media");
                const file = currentZip.file(resolvedPath) || currentZip.file(path);
                if (file) {
                    const base64 = await file.async("base64");
                    let mime = "image/png";
                    if (path.toLowerCase().endsWith(".jpeg") || path.toLowerCase().endsWith(".jpg")) mime = "image/jpeg";
                    const dataUrl = `data:${mime};base64,${base64}`;
                    document.getElementById(imgId).src = dataUrl;
                }
            } catch (e) {
                console.error(e);
            }
        }

        function onImageClick(slideNum, relId, path) {
            if (window.Android) {
                let resolvedPath = path.replace("slides/../media", "media");
                window.Android.pickImageForReplacement(resolvedPath);
            }
        }

        // Called by Android
        function replaceImage(path, newBase64) {
            const cleanBase64 = newBase64.split(',')[1];
            currentZip.file(path, cleanBase64, {base64: true});
            // Update any img tags pointing to this path
            const imgs = document.getElementsByClassName('slide-img');
            for(let i=0; i<imgs.length; i++) {
                if (imgs[i].src.length > 10) {
                    // It's hard to match exact path if we don't store it on element. 
                    // Let's just re-render or set directly if we can find it by id.
                }
            }
            renderAllSlides(); // Lazy way to refresh images
        }

        async function saveDocument() {
            const serializer = new XMLSerializer();
            
            // Sync text edits back to XML docs
            const textDivs = document.getElementsByClassName("slide-text");
            for (let i = 0; i < textDivs.length; i++) {
                const div = textDivs[i];
                const slideNum = div.dataset.slide;
                const shapeIdx = div.dataset.shapeIdx;
                
                const doc = xmlDocs[slideNum];
                if (doc) {
                    const sp = doc.getElementsByTagName("p:sp")[shapeIdx];
                    if (sp) {
                        const txBody = sp.getElementsByTagName("p:txBody")[0];
                        if (txBody) {
                            // Simple text replacement: clear existing paragraphs, add one with new text
                            while (txBody.firstChild) txBody.removeChild(txBody.firstChild);
                            
                            const pNode = doc.createElementNS("http://schemas.openxmlformats.org/drawingml/2006/main", "a:p");
                            const rNode = doc.createElementNS("http://schemas.openxmlformats.org/drawingml/2006/main", "a:r");
                            const tNode = doc.createElementNS("http://schemas.openxmlformats.org/drawingml/2006/main", "a:t");
                            tNode.textContent = div.innerText;
                            
                            rNode.appendChild(tNode);
                            pNode.appendChild(rNode);
                            txBody.appendChild(pNode);
                        }
                    }
                }
            }
            
            // Save XMLs back to ZIP
            for (let i = 1; i <= slideCount; i++) {
                if (xmlDocs[i]) {
                    const xmlStr = serializer.serializeToString(xmlDocs[i]);
                    currentZip.file(`ppt/slides/slide${i}.xml`, xmlStr);
                }
            }
            
            const base64 = await currentZip.generateAsync({type: "base64", compression: "DEFLATE"});
            if (window.Android) {
                window.Android.onDocumentSaved(base64);
            }
        }
    </script>
</body>
</html>
