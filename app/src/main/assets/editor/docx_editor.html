<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <script src="file:///android_asset/docx/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #faf9f5;
            --text-primary: #141413;
            --border: #e6dfd8;
        }
        body.dark {
            --bg-color: #151514;
            --text-primary: #f5f5f3;
            --border: #2d2b28;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        button, select {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 4px;
            cursor: pointer;
        }
        button:active {
            background: rgba(128,128,128,0.2);
        }
        #editor-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        #editor {
            min-height: 100%;
            outline: none;
            word-wrap: break-word;
        }
        #editor img {
            max-width: 100%;
            cursor: pointer;
            border: 2px solid transparent;
        }
        #editor img.selected {
            border-color: #007bff;
        }
        .controls {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <button onclick="document.execCommand('bold', false, null)"><b>B</b></button>
        <button onclick="document.execCommand('italic', false, null)"><i>I</i></button>
        <button onclick="document.execCommand('underline', false, null)"><u>U</u></button>
        <button onclick="document.execCommand('insertUnorderedList', false, null)">• List</button>
        <button onclick="document.execCommand('insertOrderedList', false, null)">1. List</button>
        <button onclick="document.execCommand('justifyLeft', false, null)">Left</button>
        <button onclick="document.execCommand('justifyCenter', false, null)">Center</button>
        <button onclick="document.execCommand('justifyRight', false, null)">Right</button>
        <select onchange="document.execCommand('fontName', false, this.value); this.selectedIndex=0;">
            <option value="">Font...</option>
            <option value="Arial">Arial</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Courier New">Courier New</option>
        </select>
        <select onchange="document.execCommand('fontSize', false, this.value); this.selectedIndex=0;">
            <option value="">Size...</option>
            <option value="1">Small</option>
            <option value="3">Normal</option>
            <option value="5">Large</option>
            <option value="7">Huge</option>
        </select>
        <button onclick="document.execCommand('undo', false, null)">Undo</button>
        <button onclick="document.execCommand('redo', false, null)">Redo</button>
        <div class="controls">
            <button onclick="saveDocument()">Save</button>
            <button onclick="if(window.Android) window.Android.exitWithoutSaving()">Exit</button>
        </div>
    </div>
    <div id="editor-container">
        <div id="editor" contenteditable="true"></div>
    </div>

    <script>
        let currentZip = null;
        let imageMap = {}; // relId -> { path, base64 }

        function loadDocx(base64, isDark) {
            if (isDark) document.body.classList.add('dark');
            
            const binary_string = window.atob(base64);
            const len = binary_string.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binary_string.charCodeAt(i);
            }
            
            JSZip.loadAsync(bytes.buffer).then(zip => {
                currentZip = zip;
                return Promise.all([
                    zip.file("word/document.xml").async("text"),
                    zip.file("word/_rels/document.xml.rels").async("text").catch(() => null)
                ]);
            }).then(results => {
                const docXml = results[0];
                const relsXml = results[1];
                parseDocument(docXml, relsXml);
            }).catch(e => {
                document.getElementById('editor').innerText = "Error loading document: " + e;
            });
        }

        async function parseDocument(docXml, relsXml) {
            // Parse rels
            let relMap = {};
            if (relsXml) {
                const relsParser = new DOMParser();
                const relsDoc = relsParser.parseFromString(relsXml, "application/xml");
                const rels = relsDoc.getElementsByTagName("Relationship");
                for (let i = 0; i < rels.length; i++) {
                    relMap[rels[i].getAttribute("Id")] = rels[i].getAttribute("Target");
                }
            }

            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(docXml, "application/xml");
            const body = xmlDoc.getElementsByTagName("w:body")[0];
            
            let html = "";
            const paragraphs = body.getElementsByTagName("w:p");
            
            for (let i = 0; i < paragraphs.length; i++) {
                const p = paragraphs[i];
                let pStyle = "";
                let pClass = "";
                
                // Align
                const jc = p.querySelector("pPr > jc");
                if (jc) {
                    const val = jc.getAttribute("w:val");
                    if (val) pStyle += `text-align: ${val};`;
                }

                // Check lists
                const numPr = p.querySelector("pPr > numPr");
                if (numPr) {
                    pClass = "list-item";
                    pStyle += "display: list-item; margin-left: 20px;";
                }

                html += `<div style="${pStyle}" class="${pClass}">`;
                
                const runs = p.getElementsByTagName("w:r");
                for (let j = 0; j < runs.length; j++) {
                    const r = runs[j];
                    let rStyle = "";
                    let isBold = r.querySelector("rPr > b") !== null;
                    let isItalic = r.querySelector("rPr > i") !== null;
                    let isUnderline = r.querySelector("rPr > u") !== null;
                    
                    const color = r.querySelector("rPr > color");
                    if (color && color.getAttribute("w:val") && color.getAttribute("w:val") !== "auto") {
                        rStyle += `color: #${color.getAttribute("w:val")};`;
                    }
                    
                    const fonts = r.querySelector("rPr > rFonts");
                    if (fonts && fonts.getAttribute("w:ascii")) {
                        rStyle += `font-family: '${fonts.getAttribute("w:ascii")}';`;
                    }
                    
                    let textHtml = "";
                    const texts = r.getElementsByTagName("w:t");
                    for (let k = 0; k < texts.length; k++) {
                        textHtml += texts[k].textContent.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    }
                    
                    // Drawing (images)
                    const drawing = r.getElementsByTagName("w:drawing")[0];
                    if (drawing) {
                        const blip = drawing.getElementsByTagName("a:blip")[0];
                        if (blip) {
                            const embedId = blip.getAttribute("r:embed");
                            if (embedId && relMap[embedId]) {
                                const target = relMap[embedId];
                                const imagePath = "word/" + target;
                                // We need to load this image async, but for simplicity, we'll assign an ID and load it after
                                const imgId = "img_" + embedId;
                                textHtml += `<img id="${imgId}" data-relid="${embedId}" data-path="${imagePath}" src="" onclick="onImageClick('${embedId}')" />`;
                                
                                loadImage(imagePath, imgId);
                            }
                        }
                    }

                    if (textHtml) {
                        let span = `<span style="${rStyle}">${textHtml}</span>`;
                        if (isBold) span = `<b>${span}</b>`;
                        if (isItalic) span = `<i>${span}</i>`;
                        if (isUnderline) span = `<u>${span}</u>`;
                        html += span;
                    }
                }
                
                html += `</div>`;
            }
            
            document.getElementById("editor").innerHTML = html;
            // Clear undo history by re-setting body (optional)
        }

        async function loadImage(path, imgId) {
            try {
                const file = currentZip.file(path);
                if (file) {
                    const base64 = await file.async("base64");
                    let mime = "image/png";
                    if (path.toLowerCase().endsWith(".jpeg") || path.toLowerCase().endsWith(".jpg")) mime = "image/jpeg";
                    const dataUrl = `data:${mime};base64,${base64}`;
                    document.getElementById(imgId).src = dataUrl;
                    imageMap[imgId.substring(4)] = { path: path, base64: base64 };
                }
            } catch (e) {
                console.error(e);
            }
        }

        function onImageClick(relId) {
            if (window.Android) {
                window.Android.pickImageForReplacement(relId);
            }
        }

        function replaceImage(relId, newBase64) {
            const imgId = "img_" + relId;
            const img = document.getElementById(imgId);
            if (img) {
                img.src = newBase64; // Data URL
                const cleanBase64 = newBase64.split(',')[1];
                const path = imageMap[relId].path;
                currentZip.file(path, cleanBase64, {base64: true});
            }
        }

        async function saveDocument() {
            // Generate simple DOCX XML from HTML
            let xml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">
<w:body>`;
            
            const editor = document.getElementById("editor");
            const divs = editor.childNodes;
            
            for (let i = 0; i < divs.length; i++) {
                const div = divs[i];
                if (div.nodeType !== 1) continue; // skip text nodes at root level
                
                xml += `<w:p>`;
                
                // Alignment
                const textAlign = div.style.textAlign;
                if (textAlign) {
                    xml += `<w:pPr><w:jc w:val="${textAlign}"/></w:pPr>`;
                }
                
                // Walk child nodes for runs
                function walkNodes(node, activeStyles) {
                    if (node.nodeType === 3) { // Text
                        const text = node.textContent;
                        if (text.length > 0) {
                            xml += `<w:r><w:rPr>`;
                            if (activeStyles.b) xml += `<w:b/>`;
                            if (activeStyles.i) xml += `<w:i/>`;
                            if (activeStyles.u) xml += `<w:u w:val="single"/>`;
                            if (activeStyles.fontFamily) xml += `<w:rFonts w:ascii="${activeStyles.fontFamily}" w:hAnsi="${activeStyles.fontFamily}"/>`;
                            if (activeStyles.fontSize) xml += `<w:sz w:val="${activeStyles.fontSize}"/>`;
                            xml += `</w:rPr><w:t xml:space="preserve">${text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")}</w:t></w:r>`;
                        }
                    } else if (node.nodeType === 1) { // Element
                        const tag = node.tagName.toLowerCase();
                        let newStyles = { ...activeStyles };
                        if (tag === 'b' || tag === 'strong') newStyles.b = true;
                        if (tag === 'i' || tag === 'em') newStyles.i = true;
                        if (tag === 'u') newStyles.u = true;
                        if (tag === 'font' && node.face) newStyles.fontFamily = node.face;
                        if (node.style && node.style.fontFamily) newStyles.fontFamily = node.style.fontFamily.replace(/['"]/g, '');
                        
                        if (tag === 'img') {
                            const relId = node.getAttribute('data-relid');
                            if (relId) {
                                xml += `<w:r><w:drawing><wp:inline><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:blipFill><a:blip r:embed="${relId}"/></pic:blipFill></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
                            }
                        } else {
                            const children = node.childNodes;
                            for (let j = 0; j < children.length; j++) {
                                walkNodes(children[j], newStyles);
                            }
                        }
                    }
                }
                
                const children = div.childNodes;
                for (let j = 0; j < children.length; j++) {
                    walkNodes(children[j], {});
                }
                
                xml += `</w:p>`;
            }
            
            xml += `</w:body></w:document>`;
            
            currentZip.file("word/document.xml", xml);
            
            const base64 = await currentZip.generateAsync({type: "base64", compression: "DEFLATE"});
            if (window.Android) {
                window.Android.onDocumentSaved(base64);
            }
        }
    </script>
</body>
</html>
