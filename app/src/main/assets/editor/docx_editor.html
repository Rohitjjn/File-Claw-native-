<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <script src="file:///android_asset/docx/jszip.min.js"></script>
    <script src="file:///android_asset/docx/docx-preview.min.js"></script>
    <style>
        :root {
            --bg-color: #faf9f5;
            --text-primary: #141413;
            --border: #e6dfd8;
        }
        body.dark {
            --bg-color: #151514;
            --text-primary: #f5f5f3;
            --border: #2d2b28;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #toolbar {
            display: flex;
            padding: 8px;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        button {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 4px;
            cursor: pointer;
            margin-left: auto;
        }
        button:active {
            background: rgba(128,128,128,0.2);
        }
        #output {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <button onclick="if(window.Android) window.Android.exitWithoutSaving()">Close</button>
    </div>
    <div id="output"></div>

    <script>
        function loadDocx(base64, isDark) {
            if (isDark) {
                document.body.classList.add('dark');
            }
            
            if (typeof docx === 'undefined' || typeof JSZip === 'undefined') {
                if (window.Android && window.Android.onDocumentError) {
                    window.Android.onDocumentError("Required libraries (docx-preview or jszip) failed to load");
                }
                return;
            }
            
            try {
                const binary_string = window.atob(base64);
                const len = binary_string.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binary_string.charCodeAt(i);
                }
                
                const arrayBuffer = bytes.buffer;
                
                const options = {
                    className: "docx",
                    inWrapper: false,
                    ignoreWidth: false,
                    ignoreHeight: false,
                    ignoreFonts: isDark,
                    breakPages: true,
                    ignoreLastRenderedPageBreak: false,
                    experimental: true,
                    trimXmlDeclaration: true,
                    debug: false
                };
                
                const container = document.getElementById("output");
                if (isDark) {
                    container.style.color = "#f5f5f3";
                }
                
                docx.renderAsync(arrayBuffer, container, null, options).then(function() {
                    if (window.Android && window.Android.onDocumentLoaded) {
                        window.Android.onDocumentLoaded(1);
                    }
                }).catch(function(err) {
                    if (window.Android && window.Android.onDocumentError) {
                        window.Android.onDocumentError(err.toString());
                    }
                    document.getElementById("output").innerHTML = "Error rendering DOCX: " + err.toString();
                });
            } catch (err) {
                if (window.Android && window.Android.onDocumentError) {
                    window.Android.onDocumentError(err.toString());
                }
            }
        }
    </script>
</body>
</html>
