<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>File Claw Word Document Viewer</title>
    <script src="jszip.min.js"></script>
    <script src="docx-preview.min.js"></script>
    <script src="docx_search.js"></script>
    <style>
        :root {
            --bg-color: #faf9f5;
            --text-primary: #141413;
            --border: #e6dfd8;
        }
        body.dark {
            --bg-color: #151514;
            --text-primary: #f5f5f3;
            --border: #2d2b28;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        /* Single Unified Scroll Container */
        #document-scroller {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            box-sizing: border-box;
            padding: 12px 8px 32px 8px;
            overscroll-behavior: contain;
        }
        #document-scroller.docx-pinch-preview { overflow-x: hidden; }

        #output {
            position: relative;
            margin: 0 auto;
            width: max-content;
            min-width: 100%;
            transform-origin: 0 0;
            transition: none;
        }

        .docx-wrapper {
            background: transparent !important;
            padding: 0 !important;
        }
        .docx, section.docx {
            margin: 0 auto 20px auto !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08) !important;
            border-radius: 8px !important;
            box-sizing: border-box !important;
            background-color: #ffffff !important;
            color: #141413 !important;
        }

        /* Dark Mode for DOCX Content */
        body.dark .docx,
        body.dark section.docx,
        body.dark .docx-wrapper > section {
            background-color: #1e1e1e !important;
            color: #e2e2e6 !important;
            box-shadow: 0 4px 24px rgba(0,0,0,0.65) !important;
            border: 1px solid #333336 !important;
        }
        body.dark .docx *:not(mark.docx-highlight) {
            color: #e2e2e6 !important;
            border-color: #383838 !important;
        }
        body.dark .docx div,
        body.dark .docx p,
        body.dark .docx span {
            background-color: transparent !important;
        }
        body.dark .docx table,
        body.dark .docx td,
        body.dark .docx th {
            background-color: transparent !important;
            border-color: #444448 !important;
            color: #e2e2e6 !important;
        }
        body.dark .docx a {
            color: #88c0d0 !important;
        }

        /* Search Highlights */
        mark.docx-highlight {
            background-color: #ffe082 !important;
            color: #000000 !important;
            border-radius: 3px;
            padding: 1px 3px;
            box-shadow: 0 0 2px rgba(0,0,0,0.3);
        }
        mark.docx-highlight-active {
            background-color: #ff9800 !important;
            color: #ffffff !important;
            outline: 2px solid #e65100;
        }

        /* Loading UI is a sibling overlay; renderer layout is always measured in #output. */
        #loading {
            position: absolute;
            inset: 0;
            z-index: 10;
            box-sizing: border-box;
            min-height: 100%;
            overflow: auto;
            background: var(--bg-color);
        }
        #loading[hidden] { display: none !important; }

        /* Page-shaped skeleton */
        .docx-skeleton {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            box-sizing: border-box;
        }
        .docx-skeleton-page {
            background: #ffffff;
            border: 1px solid rgba(25, 25, 25, .08);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 26px 22px;
            margin-bottom: 24px;
            box-sizing: border-box;
        }
        body.dark .docx-skeleton-page {
            background: #1e1e1e;
            border-color: #333336;
        }
        .docx-skeleton-bar {
            height: 10px;
            border-radius: 5px;
            background: rgba(25, 25, 25, .10);
            margin-bottom: 12px;
            animation: docx-skeleton-pulse 1.3s ease-in-out infinite;
        }
        body.dark .docx-skeleton-bar { background: rgba(255, 255, 255, .12); }
        .docx-skeleton-bar.short { width: 42%; }
        .docx-skeleton-bar.mid { width: 68%; }
        .docx-skeleton-bar.wide { width: 100%; }
        @keyframes docx-skeleton-pulse {
            0%, 100% { opacity: .45; }
            50% { opacity: .95; }
        }

        .error-banner {
            padding: 20px;
            margin: 16px;
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.3);
            border-radius: 8px;
            color: #d32f2f;
            font-size: 14px;
        }

        /* Dedicated Print Stylesheet */
        @media print {
            #loading { display: none !important; }
            html, body {
                overflow: visible !important;
                height: auto !important;
                background: #ffffff !important;
                color: #000000 !important;
            }
            #document-scroller {
                overflow: visible !important;
                height: auto !important;
                padding: 0 !important;
            }
            #output {
                zoom: 1 !important;
                transform: none !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
            }
            .docx, section.docx {
                box-shadow: none !important;
                border: none !important;
                border-radius: 0 !important;
                margin: 0 auto !important;
                page-break-after: always;
                break-after: page;
            }
            .docx:last-child, section.docx:last-child {
                page-break-after: auto;
                break-after: auto;
            }
        }
    </style>
</head>
<body>
    <div id="document-scroller">
        <div id="loading" class="docx-skeleton" role="status" aria-label="Rendering Word document">
            <div class="docx-skeleton-page">
                <div class="docx-skeleton-bar short"></div>
                <div class="docx-skeleton-bar wide"></div>
                <div class="docx-skeleton-bar wide"></div>
                <div class="docx-skeleton-bar mid"></div>
            </div>
            <div class="docx-skeleton-page">
                <div class="docx-skeleton-bar mid"></div>
                <div class="docx-skeleton-bar wide"></div>
                <div class="docx-skeleton-bar short"></div>
            </div>
        </div>
        <div id="output"></div>
    </div>

    <script>
        const isPrintMode = new URLSearchParams(window.location.search).has('print');
        const scroller = document.getElementById("document-scroller");
        const container = document.getElementById("output");
        const loadingOverlay = document.getElementById("loading");
        const diagnostics = {
            startedAt: performance.now(),
            printMode: isPrintMode,
            fetchCount: 0,
            fetchStatus: null,
            fetchBytes: 0,
            rendererAvailable: false,
            pages: 0,
            layoutReady: false
        };

        window.__DOCX_DIAGNOSTICS = diagnostics;

        function emitDiagnostic(event, fields) {
            Object.assign(diagnostics, fields || {});
            diagnostics.event = event;
            diagnostics.elapsedMs = Math.round(performance.now() - diagnostics.startedAt);
            const payload = JSON.stringify(diagnostics);
            if (window.Android && window.Android.onDocxDiagnostic) {
                try { window.Android.onDocxDiagnostic(payload); } catch (_) {}
            }
            console.debug('DOCX_DIAG ' + payload);
        }

        window.addEventListener('error', function (event) {
            emitDiagnostic('javascript_error', {
                errorKind: event.error && event.error.name ? event.error.name : 'Error',
                source: String(event.filename || '').split('/').pop().slice(0, 80),
                line: Number(event.lineno) || 0
            });
        });
        window.addEventListener('unhandledrejection', function (event) {
            const reason = event.reason;
            emitDiagnostic('unhandled_rejection', {
                errorKind: reason && reason.name ? reason.name : typeof reason
            });
        });

        let currentZoom = 1.0; // User zoom relative to fit-to-width.
        let baseScale = 1.0;   // Viewport fit-to-width ratio.
        let measuredPageWidth = 0;
        let pageObserver = null;

        function layoutMetrics(page) {
            const rect = page ? page.getBoundingClientRect() : null;
            const scrollerRect = scroller.getBoundingClientRect();
            const style = page ? getComputedStyle(page) : null;
            const outputStyle = getComputedStyle(container);
            const outputRect = container.getBoundingClientRect();
            const visible = !!page && !!rect && !!style && !!outputStyle &&
                style.display !== 'none' && style.visibility !== 'hidden' &&
                Number(style.opacity) > 0 && rect.width > 0 && rect.height > 0 &&
                rect.right > scrollerRect.left && rect.left < scrollerRect.right &&
                rect.bottom > scrollerRect.top && rect.top < scrollerRect.bottom;
            return {
                windowWidth: window.innerWidth,
                windowHeight: window.innerHeight,
                documentWidth: document.documentElement.clientWidth,
                documentHeight: document.documentElement.clientHeight,
                scrollerWidth: scroller.clientWidth,
                scrollerHeight: scroller.clientHeight,
                outputWidth: outputRect.width,
                outputHeight: outputRect.height,
                pageWidth: page ? page.offsetWidth : 0,
                pageHeight: page ? page.offsetHeight : 0,
                rectLeft: rect ? rect.left : 0,
                rectTop: rect ? rect.top : 0,
                rectRight: rect ? rect.right : 0,
                rectBottom: rect ? rect.bottom : 0,
                rectWidth: rect ? rect.width : 0,
                rectHeight: rect ? rect.height : 0,
                scrollerLeft: scrollerRect.left,
                scrollerTop: scrollerRect.top,
                scrollerRight: scrollerRect.right,
                scrollerBottom: scrollerRect.bottom,
                currentZoom: currentZoom,
                baseScale: baseScale,
                effectiveZoom: getEffectiveZoom(),
                cssZoom: outputStyle.zoom,
                transform: outputStyle.transform,
                outputDisplay: outputStyle.display,
                outputVisibility: outputStyle.visibility,
                outputOpacity: outputStyle.opacity,
                outputZoom: outputStyle.zoom,
                outputTransform: outputStyle.transform,
                scrollLeft: scroller.scrollLeft,
                scrollTop: scroller.scrollTop,
                display: style ? style.display : 'none',
                visibility: style ? style.visibility : 'hidden',
                opacity: style ? style.opacity : '0',
                visible: visible
            };
        }

        // ---------------------------------------------------------------------------
        // Fit-to-Width & Zoom Layout Engine
        // ---------------------------------------------------------------------------
        function calculateBaseScale() {
            if (isPrintMode) return 1.0;
            const style = getComputedStyle(scroller);
            const horizontalPadding = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
            const availableWidth = Math.max(1, scroller.clientWidth - horizontalPadding);
            if (!Number.isFinite(measuredPageWidth) || measuredPageWidth <= 0) return 1.0;
            const scale = availableWidth / measuredPageWidth;
            return Math.min(Math.max(scale, 0.25), 2.5);
        }

        function getEffectiveZoom() {
            return isPrintMode ? 1.0 : (baseScale * currentZoom);
        }

        function applyCommittedZoom(factor, focalX, focalY) {
            const clamped = Math.min(Math.max(Number(factor) || 1.0, 0.5), 5.0);
            const oldEffectiveZoom = getEffectiveZoom();
            currentZoom = clamped;
            const newEffectiveZoom = getEffectiveZoom();

            // Focal-point anchoring: calculate content position under focal point
            const fx = (focalX !== undefined && focalX !== null) ? focalX : (window.innerWidth / 2);
            const fy = (focalY !== undefined && focalY !== null) ? focalY : (window.innerHeight / 2);

            const contentX = (fx + scroller.scrollLeft) / oldEffectiveZoom;
            const contentY = (fy + scroller.scrollTop) / oldEffectiveZoom;

            container.style.transform = "";
            container.style.transformOrigin = "";
            container.style.zoom = String(newEffectiveZoom);

            requestAnimationFrame(() => {
                const newScrollLeft = contentX * newEffectiveZoom - fx;
                const newScrollTop = contentY * newEffectiveZoom - fy;
                scroller.scrollLeft = Math.max(0, newScrollLeft);
                scroller.scrollTop = Math.max(0, newScrollTop);
                const page = container.querySelector('.docx');
                emitDiagnostic('zoom_commit', Object.assign({}, layoutMetrics(page), {
                    currentZoom: currentZoom,
                    baseScale: baseScale,
                    effectiveZoom: getEffectiveZoom()
                }));
            });

            if (window.Android && window.Android.onZoomChanged) {
                window.Android.onZoomChanged(currentZoom);
            }
        }

        function setZoom(factor) {
            applyCommittedZoom(factor, window.innerWidth / 2, window.innerHeight / 2);
        }

        function setZoomDisplay(factor) {
            if (isPrintMode) return;
            const clamped = Math.min(Math.max(Number(factor) || 1.0, 0.5), 5.0);
            const previewRatio = clamped / currentZoom;
            container.style.transformOrigin = `${scroller.scrollLeft + window.innerWidth / 2}px ${scroller.scrollTop + window.innerHeight / 2}px`;
            container.style.transform = `scale(${previewRatio})`;
        }

        // On window resize / orientation change: update baseScale and preserve visible page
        window.addEventListener('resize', function () {
            if (isPrintMode || !container) return;
            const pages = Array.from(container.querySelectorAll('.docx'));
            let anchorPage = null;
            let anchorOffset = 0;
            for (const page of pages) {
                const rect = page.getBoundingClientRect();
                if (rect.bottom > 10) {
                    anchorPage = page;
                    anchorOffset = rect.top;
                    break;
                }
            }

            baseScale = calculateBaseScale();
            container.style.zoom = String(getEffectiveZoom());

            requestAnimationFrame(() => {
                if (anchorPage && anchorPage.isConnected) {
                    const currentTop = anchorPage.getBoundingClientRect().top;
                    const delta = currentTop - anchorOffset;
                    if (Math.abs(delta) > 1) scroller.scrollTop += delta;
                }
                const page = container.querySelector('.docx');
                emitDiagnostic('viewport_resize', Object.assign({}, layoutMetrics(page), {
                    pages: container.querySelectorAll('.docx').length,
                    layoutReady: !!page && layoutMetrics(page).visible
                }));
            });
        });

        // ---------------------------------------------------------------------------
        // Focal-Point Anchored Touch Gestures (Pinch-to-zoom & Double-tap)
        // ---------------------------------------------------------------------------
        let isPinching = false;
        let initialPinchDist = 0;
        let initialZoomOnTouch = 1.0;
        let pinchFocalX = 0;
        let pinchFocalY = 0;
        let lastTapTime = 0;
        let singleTapTimer = null;
        let lastTapPosition = { x: 0, y: 0 };

        scroller.addEventListener('touchstart', function (e) {
            if (isPrintMode) return;
            if (e.touches.length === 2) {
                isPinching = true;
                scroller.classList.add('docx-pinch-preview');
                if (singleTapTimer) { clearTimeout(singleTapTimer); singleTapTimer = null; }
                const t1 = e.touches[0];
                const t2 = e.touches[1];
                initialPinchDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                initialZoomOnTouch = currentZoom;
                pinchFocalX = (t1.clientX + t2.clientX) / 2;
                pinchFocalY = (t1.clientY + t2.clientY) / 2;
            }
        }, { passive: true });

        scroller.addEventListener('touchmove', function (e) {
            if (isPrintMode) return;
            if (isPinching && e.touches.length === 2) {
                const t1 = e.touches[0];
                const t2 = e.touches[1];
                const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                if (initialPinchDist > 5) {
                    const factor = dist / initialPinchDist;
                    const previewZoom = Math.min(Math.max(initialZoomOnTouch * factor, 0.5), 5.0);
                    const scale = previewZoom / currentZoom;
                    container.style.transformOrigin = `${pinchFocalX + scroller.scrollLeft}px ${pinchFocalY + scroller.scrollTop}px`;
                    container.style.transform = `scale(${scale})`;
                }
            }
        }, { passive: true });

        function finishPinchGesture() {
            if (!isPinching) return;
            isPinching = false;
            const transform = container.style.transform;
            container.style.transform = "";
            container.style.transformOrigin = "";
            scroller.classList.remove('docx-pinch-preview');
            const match = transform.match(/scale\(([^)]+)\)/);
            if (match) {
                const previewRatio = parseFloat(match[1]);
                if (Number.isFinite(previewRatio) && previewRatio > 0.05) {
                    const targetZoom = Math.min(Math.max(currentZoom * previewRatio, 0.5), 5.0);
                    applyCommittedZoom(targetZoom, pinchFocalX, pinchFocalY);
                }
            }
        }

        scroller.addEventListener('touchend', function (e) {
            if (!isPrintMode && e.touches.length < 2) finishPinchGesture();
        }, { passive: true });
        scroller.addEventListener('touchcancel', function () {
            if (!isPrintMode) finishPinchGesture();
        }, { passive: true });

        // Distinguish single-tap (focus mode) vs double-tap (zoom toggle) with 250ms window
        scroller.addEventListener('click', function (e) {
            if (isPrintMode) return;
            const target = e.target && e.target.closest ? e.target.closest('a, button, input') : null;
            if (target) return;

            const now = Date.now();
            const distFromLastTap = Math.hypot(e.clientX - lastTapPosition.x, e.clientY - lastTapPosition.y);
            lastTapPosition = { x: e.clientX, y: e.clientY };

            if (now - lastTapTime < 280 && distFromLastTap < 40) {
                // Double Tap!
                lastTapTime = 0;
                if (singleTapTimer) { clearTimeout(singleTapTimer); singleTapTimer = null; }
                const newZoom = (currentZoom > 1.4) ? 1.0 : 2.0;
                applyCommittedZoom(newZoom, e.clientX, e.clientY);
                if (window.Android && window.Android.onDocumentDoubleTap) {
                    window.Android.onDocumentDoubleTap();
                }
            } else {
                lastTapTime = now;
                if (singleTapTimer) clearTimeout(singleTapTimer);
                singleTapTimer = setTimeout(() => {
                    singleTapTimer = null;
                    if (window.Android && window.Android.onDocumentTap) {
                        window.Android.onDocumentTap();
                    }
                }, 250);
            }
        });

        // ---------------------------------------------------------------------------
        // Rendering & Loading
        // ---------------------------------------------------------------------------
        function setDarkMode(isDark) {
            if (isPrintMode) return;
            document.body.classList.toggle('dark', Boolean(isDark));
            document.documentElement.classList.toggle('dark', Boolean(isDark));
        }

        function scrollToPage(pageNumber) {
            const pages = document.querySelectorAll('#output .docx');
            const page = pages[Math.max(0, Math.min(pages.length - 1, Number(pageNumber) - 1))];
            if (page) page.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function observePages() {
            if (pageObserver) pageObserver.disconnect();
            const pages = Array.from(document.querySelectorAll('#output .docx'));
            if (!pages.length || !('IntersectionObserver' in window)) return;
            pageObserver = new IntersectionObserver(function (entries) {
                const visible = entries.filter(entry => entry.isIntersecting);
                if (!visible.length) return;
                const center = (window.innerHeight || 0) / 2;
                visible.sort((a, b) => {
                    const rectA = a.boundingClientRect;
                    const rectB = b.boundingClientRect;
                    return Math.abs((rectA.top + rectA.bottom) / 2 - center) - Math.abs((rectB.top + rectB.bottom) / 2 - center);
                });
                const currentIndex = pages.indexOf(visible[0].target);
                if (window.Android && window.Android.onPageChanged && currentIndex >= 0) {
                    window.Android.onPageChanged(currentIndex + 1, pages.length);
                }
            }, { threshold: [0.15, 0.5, 0.85] });
            pages.forEach(page => pageObserver.observe(page));
        }

        function showLoadError(message, errorKind) {
            const page = container ? container.querySelector('.docx') : null;
            emitDiagnostic('preview_error', Object.assign({
                errorKind: String(errorKind || 'PreviewError').slice(0, 80),
                pages: container ? container.querySelectorAll('.docx').length : 0,
                layoutReady: false
            }, layoutMetrics(page)));
            if (loadingOverlay) loadingOverlay.hidden = true;
            if (container) {
                const errorBanner = document.createElement('div');
                errorBanner.className = 'error-banner';
                errorBanner.setAttribute('role', 'alert');
                errorBanner.textContent = String(message || 'Unknown preview error');
                container.replaceChildren(errorBanner);
            }
            if (window.Android && window.Android.onDocumentError) {
                window.Android.onDocumentError(String(message || 'DOCX preview failed'));
            }
        }

        async function fetchDocumentBytes() {
            const url = '/docx-src/document.docx';
            diagnostics.fetchCount += 1;
            emitDiagnostic('fetch_start', { fetchUrl: url, fetchCount: diagnostics.fetchCount });
            const started = performance.now();
            const response = await fetch(url, { credentials: 'omit', cache: 'no-store' });
            const mime = response.headers.get('Content-Type') || '';
            const declaredLength = Number(response.headers.get('Content-Length')) || 0;
            if (!response.ok) {
                diagnostics.fetchStatus = response.status;
                emitDiagnostic('fetch_failed', { fetchStatus: response.status, fetchMime: mime });
                throw new Error('DOCX_FETCH_HTTP_' + response.status);
            }
            const buffer = await response.arrayBuffer();
            const bytes = new Uint8Array(buffer);
            const hasZipSignature = bytes.length >= 4 && bytes[0] === 0x50 && bytes[1] === 0x4b &&
                (bytes[2] === 0x03 || bytes[2] === 0x05 || bytes[2] === 0x07);
            emitDiagnostic('fetch_complete', {
                fetchStatus: response.status,
                fetchMime: mime.slice(0, 120),
                fetchContentLength: declaredLength,
                fetchBytes: bytes.byteLength,
                fetchDurationMs: Math.round(performance.now() - started),
                docxMagic: hasZipSignature
            });
            if (!bytes.byteLength || !hasZipSignature) throw new Error('DOCX_FETCH_INVALID_BYTES');
            return buffer;
        }

        function nextAnimationFrame() {
            return new Promise(resolve => requestAnimationFrame(() => resolve()));
        }

        function pageHasRenderableContent(page) {
            if (!page) return false;
            if ((page.innerText || '').trim().length > 0) return true;
            return !!page.querySelector('img, svg, canvas, table, video');
        }

        async function renderDocument(arrayBuffer) {
            if (!container) throw new Error('DOCX_OUTPUT_MISSING');
            const rendererAvailable = typeof docx !== 'undefined' && typeof docx.renderAsync === 'function' &&
                typeof JSZip !== 'undefined';
            diagnostics.rendererAvailable = rendererAvailable;
            emitDiagnostic('render_start', {
                fetchBytes: arrayBuffer.byteLength,
                rendererAvailable: rendererAvailable,
                printMode: isPrintMode
            });
            if (!rendererAvailable) throw new Error('DOCX_RENDERER_UNAVAILABLE');

            const options = {
                className: "docx",
                inWrapper: true,
                ignoreWidth: false,
                ignoreHeight: false,
                ignoreFonts: false,
                breakPages: true,
                ignoreLastRenderedPageBreak: false,
                experimental: true,
                trimXmlDeclaration: true,
                debug: false
            };

            // Render into the real, attached layout container. The old off-screen,
            // visibility:hidden max-content staging node let the renderer measure a
            // different containing block than the one ultimately shown on screen.
            container.replaceChildren();
            scroller.scrollLeft = 0;
            scroller.scrollTop = 0;
            const renderStarted = performance.now();
            try {
                await docx.renderAsync(arrayBuffer, container, null, options);
                const pages = Array.from(container.querySelectorAll('.docx'));
                diagnostics.pages = pages.length;
                if (!pages.length) throw new Error('DOCX_RENDERED_WITHOUT_PAGES');
                const firstPage = pages[0];
                measuredPageWidth = firstPage.offsetWidth;
                if (!Number.isFinite(measuredPageWidth) || measuredPageWidth <= 0) {
                    throw new Error('DOCX_PAGE_HAS_NO_LAYOUT_WIDTH');
                }
                baseScale = calculateBaseScale();
                const effectiveZoom = getEffectiveZoom();
                if (!Number.isFinite(effectiveZoom) || effectiveZoom <= 0) {
                    throw new Error('DOCX_INVALID_EFFECTIVE_ZOOM');
                }
                container.style.zoom = String(effectiveZoom);
                if (!isPrintMode && document.body.classList.contains('dark')) setDarkMode(true);

                // Hide the opaque loading overlay, then wait for browser layout/paint
                // frames rather than a guessed time delay before validating visibility.
                if (loadingOverlay) loadingOverlay.hidden = true;
                scroller.scrollLeft = 0;
                scroller.scrollTop = 0;
                await nextAnimationFrame();
                await nextAnimationFrame();

                const metrics = layoutMetrics(firstPage);
                const contentPresent = pageHasRenderableContent(firstPage);
                const zoomValid = Number.isFinite(getEffectiveZoom()) && getEffectiveZoom() > 0;
                const layoutReady = metrics.visible && contentPresent && zoomValid;
                emitDiagnostic('render_layout', Object.assign({}, metrics, {
                    pages: pages.length,
                    renderDurationMs: Math.round(performance.now() - renderStarted),
                    contentPresent: contentPresent,
                    layoutReady: layoutReady
                }));
                if (!layoutReady) {
                    throw new Error(metrics.visible ? 'DOCX_PAGE_HAS_NO_VISIBLE_CONTENT' : 'DOCX_PAGE_OUTSIDE_VIEWPORT');
                }

                diagnostics.layoutReady = true;
                observePages();
                emitDiagnostic('render_visible_ready', Object.assign({}, metrics, {
                    pages: pages.length,
                    layoutReady: true
                }));
                if (window.Android && window.Android.onDocumentLoaded) {
                    window.Android.onDocumentLoaded(pages.length);
                }
                if (isPrintMode && window.Android && window.Android.onPrintReady) {
                    window.Android.onPrintReady();
                }
            } catch (error) {
                const errorKind = error && error.message ? String(error.message).slice(0, 80) :
                    (error && error.name ? error.name : 'RenderError');
                emitDiagnostic('render_failed', {
                    errorKind: String(errorKind).slice(0, 80),
                    pages: container.querySelectorAll('.docx').length,
                    renderDurationMs: Math.round(performance.now() - renderStarted)
                });
                showLoadError('The DOCX renderer did not produce a visible page. Use text recovery or retry.', errorKind);
            }
        }

        let loadStarted = false;
        function loadDocx(isDark) {
            if (loadStarted) {
                emitDiagnostic('duplicate_load_ignored', { fetchCount: diagnostics.fetchCount });
                return;
            }
            loadStarted = true;
            if (!isPrintMode) setDarkMode(isDark);

            if (typeof docx === 'undefined' || typeof JSZip === 'undefined') {
                emitDiagnostic('engine_unavailable', { rendererAvailable: false });
                showLoadError("Document preview engine components could not be loaded.");
                return;
            }

            fetchDocumentBytes().then(function (buffer) {
                return renderDocument(buffer);
            }).catch(function (error) {
                const errorKind = error && error.message ? String(error.message).slice(0, 80) :
                    (error && error.name ? error.name : 'LoadError');
                emitDiagnostic('load_failed', { errorKind: String(errorKind).slice(0, 80) });
                showLoadError("DOCX preview could not load or render the local document.", errorKind);
            });
        }

        // ---------------------------------------------------------------------------
        // In-Document Text Search
        // ---------------------------------------------------------------------------
        let maxSearchHighlights = 5000;
        let searchMatches = [];
        let currentMatchIdx = -1;
        let totalSearchMatches = 0;
        let searchMatchesTruncated = false;

        function notifySearchCount() {
            if (window.Android && window.Android.onSearchResultCount) {
                window.Android.onSearchResultCount(totalSearchMatches, currentMatchIdx, searchMatchesTruncated);
            }
        }

        function clearSearch() {
            document.querySelectorAll('mark.docx-highlight').forEach(el => {
                const parent = el.parentNode;
                if (parent) {
                    parent.replaceChild(document.createTextNode(el.textContent || ''), el);
                    parent.normalize();
                }
            });
            searchMatches = [];
            currentMatchIdx = -1;
            totalSearchMatches = 0;
            searchMatchesTruncated = false;
        }

        function searchWord(keyword) {
            clearSearch();
            if (!String(keyword || '').trim() || !container || typeof DocxSearch === 'undefined') {
                notifySearchCount();
                return 0;
            }

            const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
                acceptNode: function (node) {
                    const parent = node.parentElement;
                    if (!parent || !node.nodeValue || parent.closest('script, style, button, mark.docx-highlight')) {
                        return NodeFilter.FILTER_REJECT;
                    }
                    return NodeFilter.FILTER_ACCEPT;
                }
            });
            const textNodes = [];
            while (walker.nextNode()) textNodes.push(walker.currentNode);
            const result = DocxSearch.findMatches(textNodes, keyword, maxSearchHighlights);
            const groups = result.matches.map(() => []);
            const rangesByNode = new Map();

            result.matches.forEach((match, matchIndex) => {
                match.ranges.forEach(segment => {
                    if (!rangesByNode.has(segment.node)) rangesByNode.set(segment.node, []);
                    rangesByNode.get(segment.node).push({ ...segment, matchIndex });
                });
            });

            // Wrap each text-node segment from right to left so earlier offsets stay valid.
            for (const [node, segments] of rangesByNode) {
                segments.sort((a, b) => b.start - a.start);
                for (const segment of segments) {
                    if (!node.parentNode || segment.end > node.length) continue;
                    const mark = document.createElement('mark');
                    mark.className = 'docx-highlight';
                    const range = document.createRange();
                    range.setStart(node, segment.start);
                    range.setEnd(node, segment.end);
                    try {
                        range.surroundContents(mark);
                        groups[segment.matchIndex].push(mark);
                    } catch (error) {
                        console.warn('Could not highlight one DOCX search segment', error);
                    }
                }
            }

            searchMatches = groups.filter(group => group.length > 0);
            totalSearchMatches = result.total;
            searchMatchesTruncated = result.truncated || searchMatches.length < result.matches.length;
            if (searchMatches.length > 0) highlightMatch(0);
            else notifySearchCount();
            return totalSearchMatches;
        }

        function highlightMatch(idx) {
            if (!searchMatches.length) {
                currentMatchIdx = -1;
                notifySearchCount();
                return 0;
            }
            currentMatchIdx = ((idx % searchMatches.length) + searchMatches.length) % searchMatches.length;
            searchMatches.forEach((group, index) => {
                group.forEach(mark => {
                    mark.className = index === currentMatchIdx
                        ? 'docx-highlight docx-highlight-active'
                        : 'docx-highlight';
                });
            });
            searchMatches[currentMatchIdx][0].scrollIntoView({ behavior: 'smooth', block: 'center' });
            notifySearchCount();
            return currentMatchIdx + 1;
        }

        function nextSearchMatch() {
            return searchMatches.length ? highlightMatch(currentMatchIdx + 1) : 0;
        }

        function prevSearchMatch() {
            return searchMatches.length ? highlightMatch(currentMatchIdx - 1) : 0;
        }
    </script>
</body>
</html>
