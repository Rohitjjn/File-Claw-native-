<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta id="docx-viewport" name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes">
    <meta name="color-scheme" content="light dark">
    <title>DOCX viewer</title>
    <style>
        :root { color-scheme: light; --paper: #f0f0f0; --ink: #141413; --edge: #e6dfd8; --page-paper: #ffffff; --page-ink: #141413; --page-edge: #e6dfd8; }
        :root.dark { color-scheme: dark; --paper: #181715; --ink: #faf9f5; --edge: #2d2c2a; --page-paper: #252320; --page-ink: #faf9f5; --page-edge: #2d2c2a; }
        * { box-sizing: border-box; }
        html, body { width: 100%; min-width: 0; height: 100%; margin: 0; overflow: hidden; background: var(--paper); color: var(--ink); font-family: "Noto Sans Devanagari", "Noto Sans", system-ui, sans-serif; }
        html { min-width: 200vw; }
        body, #scroller { width: 100vw; }
        #scroller { position: absolute; inset: 0; overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 12px 12px 28px; }
        #status { position: sticky; z-index: 5; top: 0; margin: 12px auto; padding: 12px 16px; width: fit-content; max-width: calc(100% - 24px); border: 1px solid var(--edge); border-radius: 10px; background: var(--paper); color: var(--ink); box-shadow: 0 2px 10px #0002; }
        #status[hidden] { display: none; }
        #status.error { position: relative; width: auto; color: #a31520; border-color: #d98389; }
        #stage { position: relative; display: flex; justify-content: center; align-items: flex-start; width: 100%; min-height: 24px; }
        #scaled-document { position: relative; box-sizing: border-box; flex: 0 0 100%; width: 100%; max-width: 100%; margin-inline: auto; }
        #scaled-document .docx-wrapper { box-sizing: border-box; width: 100%; max-width: 100%; background: transparent !important; padding: 0 !important; }
        #scroller.zoom-anchor-space #stage { width: 200%; justify-content: flex-start; padding-top: 50vh; }
        #scroller.zoom-anchor-space #stage::before { content: ""; flex: 0 0 25%; }
        #scroller.zoom-anchor-space #scaled-document { flex: 0 0 50%; width: 50%; max-width: none; margin-inline: 0; }
        #scaled-document .docx, #scaled-document section.docx { margin: 0 auto 20px !important; box-sizing: border-box !important; border-radius: 6px; background: var(--page-paper) !important; color: var(--page-ink) !important; border-color: var(--page-edge) !important; box-shadow: 0 3px 16px #0002 !important; }
        #scaled-document a { pointer-events: auto !important; cursor: pointer; }
        #scaled-document .docx p, #scaled-document section.docx p { overflow-wrap: anywhere; }
        #scaled-document .docx table, #scaled-document section.docx table { max-width: 100%; border-collapse: collapse; overflow-wrap: anywhere; }
        #scaled-document .docx td, #scaled-document .docx th,
        #scaled-document section.docx td, #scaled-document section.docx th { border-color: var(--page-edge) !important; }
        :root.dark #scaled-document .docx, :root.dark #scaled-document section.docx { box-shadow: 0 3px 16px #0008 !important; }
        #scaled-document img { max-width: 100%; }
        mark.docx-highlight { background: #ffe082 !important; color: #17130d !important; border-radius: 2px; }
        mark.docx-highlight-active { background: #ff9800 !important; outline: 2px solid #e65100; }
        @media print {
            html, body { width: auto; min-width: 0; height: auto; overflow: visible; background: #fff; }
            #scroller { position: static; overflow: visible; height: auto; padding: 0; }
            #status { display: none !important; }
            #stage { display: block; min-height: 0; }
            #scaled-document { position: static; width: auto !important; }
            #scaled-document .docx, #scaled-document section.docx { box-shadow: none !important; border: 0 !important; border-radius: 0 !important; break-after: page; page-break-after: always; }
            #scaled-document .docx:last-child, #scaled-document section.docx:last-child { break-after: auto; page-break-after: auto; }
        }
    </style>
    <script defer src="jszip.min.js"></script>
    <script defer src="docx-preview.min.js"></script>
    <script defer src="search.js"></script>
    <script defer src="render-readiness.js"></script>
    <script defer src="viewport-fit.js"></script>
    <script defer src="viewer.js"></script>
</head>
<body>
    <main id="scroller" aria-label="Word document preview">
        <div id="status" role="status" aria-live="polite">Loading document…</div>
        <div id="stage"><div id="scaled-document"></div></div>
    </main>
</body>
</html>
