name: DOCX Rehabilitation Verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docx-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit, WebView and debug APK verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android command-line tools missing from runner: $ANDROID_HOME" >&2
            exit 1
          fi
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          # sdkmanager installs tools but does not guarantee them on PATH for later steps.
          printf '%s\n' "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Run unit tests, lint, Detekt, WebView instrumentation and debug APK build
        run: |
          set -euo pipefail
          ./gradlew \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:detekt \
            :app:compileDebugKotlin \
            :app:assembleDebug \
            --stacktrace

      - name: Enable hardware acceleration for the Android emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Android emulator and run DOCX WebView integration tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        timeout-minutes: 15
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Verify bundled DOCX JavaScript and search regression tests
        if: always()
        run: |
          set -euo pipefail
          node --test tools/docx-tests/docx-search.test.cjs
          node --check app/src/main/assets/editor/docx_search.js
          node --check app/src/main/assets/editor/docx-preview.min.js
          node --check app/src/main/assets/editor/jszip.min.js

      - name: Upload debug APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docx-rehabilitation-${{ github.sha }}
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/detekt/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
