name: DOCX Rehabilitation Verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docx-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit, WebView and debug APK verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android command-line tools missing from runner: $ANDROID_HOME" >&2
            exit 1
          fi
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          # sdkmanager installs tools but does not guarantee them on PATH for later steps.
          printf '%s\n' "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Run unit tests, lint, Detekt, WebView instrumentation and debug APK build
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/docx-gradle-verification.log"
          set +e
          ./gradlew \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:detekt \
            :app:compileDebugKotlin \
            :app:assembleDebug \
            --stacktrace --console=plain 2>&1 | tee "$log_file"
          gradle_status=${PIPESTATUS[0]}
          set -e
          if [ "$gradle_status" -ne 0 ]; then
            echo "## Gradle verification failure (last 100 lines)" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 "$log_file" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 "$log_file"
            diagnostic=$(grep -E -A18 -B3 '^\* What went wrong:|^Execution failed for task|^e: |^error:' "$log_file" | tail -n 50 | tr '\n' ' ' | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
            if [ -z "$diagnostic" ]; then
              diagnostic=$(tail -n 45 "$log_file" | tr '\n' ' ' | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
            fi
            echo "::error title=Gradle verification details::$diagnostic"
            python3 - <<'PY'
          from pathlib import Path
          import html
          import os
          import xml.etree.ElementTree as ET

          reports = sorted(Path('app/build/test-results/testDebugUnitTest').rglob('*.xml'))
          failures = []
          for report in reports:
              try:
                  root = ET.parse(report).getroot()
              except (ET.ParseError, OSError):
                  continue
              for case in root.iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      message = failure.get('message') or (failure.text or '').strip() or 'No failure detail in XML'
                      detail = f"{case.get('classname', '')}.{case.get('name', 'unknown')}: {' '.join(html.unescape(message).split())[:1200]}"
                      failures.append(detail)

          if failures:
              summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
              with summary.open('a') as output:
                  output.write('\n## JVM unit test failures\n')
                  for detail in failures:
                      output.write(f'\n- `{detail}`\n')
                      escaped = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f'::error title=JVM unit test failure::{escaped}')
          PY
            exit "$gradle_status"
          fi

      - name: Enable hardware acceleration for the Android emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Android emulator and run DOCX WebView integration tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        timeout-minutes: 15
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: bash tools/docx-tests/run-android-instrumentation.sh

      - name: Surface Android instrumentation failures
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import xml.etree.ElementTree as ET

          reports = sorted(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          failures = []
          for report in reports:
              try:
                  root = ET.parse(report).getroot()
              except (ET.ParseError, OSError):
                  continue
              for case in root.iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      message = failure.get('message') or (failure.text or '').strip() or 'No failure detail in XML'
                      message = ' '.join(html.unescape(message).split())[:1500]
                      failures.append((case.get('classname', ''), case.get('name', 'unknown'), message))

          summary = Path(__import__('os').environ['GITHUB_STEP_SUMMARY'])
          if failures:
              lines = ['## Android instrumentation failures', '']
              for classname, name, message in failures:
                  detail = f'{classname}.{name}: {message}'
                  print(f'::error title=Android instrumentation failure::{detail}')
                  lines.extend((f'### `{classname}.{name}`', '', message, ''))
              summary.write_text('\n'.join(lines))
          else:
              print(f'No Android instrumentation failures found in {len(reports)} XML reports.')
              summary.write_text(f'No Android instrumentation failures found in {len(reports)} XML reports.\n')
          PY

      - name: Verify bundled DOCX JavaScript and search regression tests
        if: always()
        run: |
          set -euo pipefail
          node --test tools/docx-tests/docx-search.test.cjs tools/docx-tests/docx-readiness.test.cjs
          node --check app/src/main/assets/docx_viewer/search.js
          node --check app/src/main/assets/docx_viewer/render-readiness.js
          node --check app/src/main/assets/docx_viewer/viewer.js
          node --check app/src/main/assets/docx_viewer/docx-preview.min.js
          node --check app/src/main/assets/docx_viewer/jszip.min.js

      - name: Upload debug APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docx-rehabilitation-${{ github.sha }}
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/detekt/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/outputs/docx-test-screenshots/**/*.png
