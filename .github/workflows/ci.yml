name: CI

# Phase 0 addition (2026-11-17): Quality Gate for every push/PR.
# Kept deliberately small — compile + JVM unit tests + debug APK. Release signing/publishing lives in
# build-and-release.yml. First run is unverified; watch it and fix forward.
on:
  push:
    # Round 1 (phases 0–9) lands on the feature branch first; main gets it all at the end.
    branches: [main, arena/5100f329-file-claw-native]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate (compile · test · assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships with the Android SDK in $ANDROID_HOME; accept licenses so Gradle can resolve.
      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Compile Kotlin
        run: ./gradlew compileDebugKotlin --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # AUD-034 / Phase 1: fail visibly (but not the build) when the Room schema history is
      # missing 4.json. room.schemaLocation makes every KSP run emit the current schema, so
      # this step tells us the committed file was never regenerated/committed for v4.
      - name: Room schema drift check (non-fatal)
        run: |
          if [ ! -f app/schemas/com.example.data.AppDatabase/4.json ]; then
            echo "::warning title=AUD-034::app/schemas/com.example.data.AppDatabase/4.json is not committed. Run ./gradlew kspDebugKotlin on a networked machine and commit the file. Room does not consume it at runtime; it is the migration-test baseline."
          else
            echo "Room 4.json present."
          fi

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore
